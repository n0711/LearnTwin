name: Frederick Academic Import

on:
  pull_request:
    paths:
      - 'backend/academic.py'
      - 'backend/academic_routes.py'
      - 'backend/academic_store/**'
      - 'frontend/src/TranscriptPanel.jsx'
      - 'frontend/src/DegreePlanner.jsx'
      - 'tests/test_academic.py'
      - 'requirements.txt'
      - '.github/workflows/academic-import.yml'

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/test_academic.py
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path backend/academic_store/Cargo.toml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
